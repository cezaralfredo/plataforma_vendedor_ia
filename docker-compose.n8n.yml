# =============================================================================
# Stack Portainer: n8n (Orquestrador de Fluxos e Subagentes)
# =============================================================================
# Conecta à rede 'npm' para acesso web via Nginx Proxy Manager (n8n.seudominio.com)
# Conecta à rede 'mcp_internal' para comunicação direta e interna com a API e Hermes
# =============================================================================

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-147.224.215.151}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - NODE_ENV=production
      - WEBHOOK_URL=${WEBHOOK_URL:-http://147.224.215.151:5678/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Sao_Paulo}
      - TZ=${TZ:-America/Sao_Paulo}
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168  # 7 dias de retenção de logs
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - AGENDA_API_URL=${AGENDA_API_URL:-http://agenda-api:8000}
      - AGENDA_API_KEY=${API_KEY:?Defina API_KEY no Portainer}
      # Provedor de Notificação: 'hermes' (padrão) ou 'meta'
      - WHATSAPP_NOTIFICATION_PROVIDER=${WHATSAPP_NOTIFICATION_PROVIDER:-hermes}
      - HERMES_WHATSAPP_BRIDGE_URL=${HERMES_WHATSAPP_BRIDGE_URL:-http://hermes:3000}
      # Configurações para quando WHATSAPP_NOTIFICATION_PROVIDER=meta
      - META_WHATSAPP_API_URL=${META_WHATSAPP_API_URL:-https://graph.facebook.com/v21.0}
      - META_PHONE_NUMBER_ID=${META_PHONE_NUMBER_ID:-}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - META_PAYMENT_TEMPLATE_NAME=${META_PAYMENT_TEMPLATE_NAME:-confirmacao_pagamento}
      - META_TEMPLATE_LANGUAGE=${META_TEMPLATE_LANGUAGE:-pt_BR}
      - META_MESSAGE_TYPE=${META_MESSAGE_TYPE:-template}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - npm
      - mcp_internal
      - hermes_internal

volumes:
  n8n_data:

networks:
  npm:
    external: true
    name: ${NPM_NETWORK:-nginx-proxy_default}
  mcp_internal:
    external: true
    name: ${AGENDA_MCP_NETWORK:-agenda_mcp_internal}
  # Rede do Hermes: necessária para o n8n alcançar a bridge WhatsApp privada.
  hermes_internal:
    external: true
    name: ${HERMES_NETWORK:-hermes_default}
