version: "3.8"

services:
  # --- BANCO DE DADOS (POSTGRESQL + PGVECTOR) ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: BZ3fusNEdP4TJp1kmHeD3UD1KjnnfdEb
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    networks:
      - app_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # --- CACHE ---
  redis:
    image: redis:alpine
    container_name: redis
    command: redis-server --requirepass Wupqro8D6eOgwWCrxy7FM0GRQUzTrD1K
    networks:
      - app_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Wupqro8D6eOgwWCrxy7FM0GRQUzTrD1K", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- API GATEWAY (NGINX) ---
  evo_gateway:
    image: evoapicloud/evo-crm-gateway:1.0.0
    container_name: evo_gateway
    environment:
      - AUTH_UPSTREAM=evo_auth:3001
      - CRM_UPSTREAM=evo_crm:3000
      - CORE_UPSTREAM=evo_core:5555
      - PROCESSOR_UPSTREAM=evo_processor:8000
      - BOT_RUNTIME_UPSTREAM=evo_bot_runtime:8080
    networks:
      - app_network
    restart: unless-stopped

  # --- AUTH SERVICE (RUBY ON RAILS) ---
  evo_auth:
    image: evoapicloud/evo-auth-service-community:1.0.0
    container_name: evo_auth
    # Plano A: entrypoint oficial `docker/entrypoints/rails.sh` faz wait-postgres
    # + db:prepare quando RUN_MIGRATIONS=true. Substitui o command inline.
    environment: &auth_env
      RAILS_ENV: production
      RUN_MIGRATIONS: "true"
      SECRET_KEY_BASE: AHRQJ7gsRLNBQe3rLOJZZ6bXcd7BnHPj
      JWT_SECRET_KEY: JyqjqFKgMQKZfyGA54T9petIFMrGkErP
      EVOAI_CRM_API_TOKEN: wV6a2ftF4z8ZRcHkOpg7QhxyZumE0CJ1
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: BZ3fusNEdP4TJp1kmHeD3UD1KjnnfdEb
      POSTGRES_DATABASE: evo_community
      REDIS_URL: redis://:Wupqro8D6eOgwWCrxy7FM0GRQUzTrD1K@redis:6379/0
      FRONTEND_URL: https://crm.prismadigital.app.br
      BACKEND_URL: https://apicrm.prismadigital.app.br
      CORS_ORIGINS: https://crm.prismadigital.app.br,https://apicrm.prismadigital.app.br
      DOORKEEPER_JWT_SECRET_KEY: ueFy2Q5z2VZaHJQwzG6b8NPdTu1H0DiI
      RAILS_FORCE_SSL: "false"
      TRUSTED_PROXIES: "0.0.0.0/0"
      ALLOWED_HOSTS: "crm.prismadigital.app.br,apicrm.prismadigital.app.br"
      # --- ACTIVE STORAGE (v1.0.0 ENV-first) ---
      ACTIVE_STORAGE_SERVICE: local
      ACTIVE_STORAGE_URL: https://apicrm.prismadigital.app.br
      # --- CONFIGURAÇÕES DE E-MAIL (SMTP) ---
      SMTP_ADDRESS: mail.prismadigital.app.br
      SMTP_PORT: 587
      SMTP_USER_NAME: contato@prismadigital.app.br
      SMTP_PASSWORD: Solucao*Total10
      SMTP_DOMAIN: prismadigital.app.br
      SMTP_AUTHENTICATION: login
      SMTP_ENABLE_STARTTLS_AUTO: true
      SMTP_FROM: Evo CRM <contato@prismadigital.app.br>
    volumes:
      - evo_auth_storage:/rails/storage
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  evo_auth_sidekiq:
    image: evoapicloud/evo-auth-service-community:1.0.0
    container_name: evo_auth_sidekiq
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    healthcheck:
      disable: true
    environment:
      <<: *auth_env
      # Sobrescreve &auth_env: sidekiq nao migra, web ja faz db:prepare.
      RUN_MIGRATIONS: "false"
    volumes:
      - evo_auth_storage:/rails/storage
    networks:
      - app_network
    restart: unless-stopped

  # --- CRM SERVICE (RUBY ON RAILS) ---
  evo_crm:
    image: evoapicloud/evo-ai-crm-community:1.0.0
    container_name: evo_crm
    # Plano A: entrypoint oficial `docker/entrypoints/rails.sh` faz wait-postgres
    # + db:prepare quando RUN_MIGRATIONS=true. Substitui o until-wget + migrate inline.
    # O wait-auth eh coberto por depends_on no Portainer.
    environment: &crm_env
      RAILS_ENV: production
      RUN_MIGRATIONS: "true"
      SECRET_KEY_BASE: AHRQJ7gsRLNBQe3rLOJZZ6bXcd7BnHPj
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: BZ3fusNEdP4TJp1kmHeD3UD1KjnnfdEb
      POSTGRES_DATABASE: evo_community
      REDIS_URL: redis://:Wupqro8D6eOgwWCrxy7FM0GRQUzTrD1K@redis:6379/0
      EVO_AUTH_SERVICE_URL: http://evo_auth:3001
      EVO_AI_CORE_SERVICE_URL: http://evo_core:5555
      EVO_AI_PROCESSOR_URL: http://evo_processor:8000
      BACKEND_URL: https://apicrm.prismadigital.app.br
      FRONTEND_URL: https://crm.prismadigital.app.br
      CORS_ORIGINS: https://crm.prismadigital.app.br,https://apicrm.prismadigital.app.br,http://crm.prismadigital.app.br
      BOT_RUNTIME_URL: http://evo_bot_runtime:8080
      BOT_RUNTIME_SECRET: jT0ujzuCZAILApLUsbrQ12vOC49nCaB9
      BOT_RUNTIME_POSTBACK_BASE_URL: http://evo_crm:3000
      AUTH_SERVICE_URL: http://evo_auth:3001
      # --- ACTIVE STORAGE (v1.0.0 ENV-first) ---
      ACTIVE_STORAGE_SERVICE: local
      ACTIVE_STORAGE_URL: https://apicrm.prismadigital.app.br
      # --- WEBHOOKS (v1.0.0) ---
      WEBHOOK_BY_EVENTS: "true"
      # --- EVOFLOW (Parte 1) ---
      EVO_FLOW_ENABLED: "true"
      EVO_FLOW_API_URL: http://evo_flow:3334/api/v1
      AUTH_APIKEY_INTEGRATION_LOCAL: epzkTH3mV6QgnCvP6186rD15Rx3hTGqM
      EVO_FLOW_ALLOW_INSECURE: "true"
    volumes:
      - evo_crm_storage:/app/storage
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  evo_crm_sidekiq:
    image: evoapicloud/evo-ai-crm-community:1.0.0
    container_name: evo_crm_sidekiq
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    healthcheck:
      disable: true
    environment:
      <<: *crm_env
      # Sobrescreve &crm_env: sidekiq nao migra, web ja faz db:prepare.
      RUN_MIGRATIONS: "false"
    volumes:
      - evo_crm_storage:/app/storage
    networks:
      - app_network
    restart: unless-stopped

  # --- AI CORE SERVICE (GO / GIN) ---
  evo_core:
    image: evoapicloud/evo-ai-core-service-community:1.0.0
    container_name: evo_core
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: BZ3fusNEdP4TJp1kmHeD3UD1KjnnfdEb
      DB_NAME: evo_community
      DB_SSLMODE: disable
      PORT: "5555"
      SECRET_KEY_BASE: AHRQJ7gsRLNBQe3rLOJZZ6bXcd7BnHPj
      JWT_SECRET_KEY: JyqjqFKgMQKZfyGA54T9petIFMrGkErP
      JWT_ALGORITHM: HS256
      ENCRYPTION_KEY: fw62ngbkPcqHTMk07N6c7kJZGCfMYlWHWW9PDgqudVY=
      EVO_AUTH_BASE_URL: http://evo_auth:3001
      EVOLUTION_BASE_URL: http://evo_crm:3000
      AI_PROCESSOR_URL: http://evo_processor:8000
      AI_PROCESSOR_VERSION: community
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5555/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # --- AI PROCESSOR (PYTHON / FASTAPI) ---
  evo_processor:
    image: evoapicloud/evo-ai-processor-community:1.0.0
    container_name: evo_processor
    command: sh -c "sleep 10; alembic upgrade head; python -m scripts.run_seeders; uvicorn src.main:app --host 0.0.0.0 --port 8000"
    environment:
      POSTGRES_CONNECTION_STRING: postgresql://postgres:BZ3fusNEdP4TJp1kmHeD3UD1KjnnfdEb@postgres:5432/evo_community
      REDIS_HOST: redis
      REDIS_PASSWORD: Wupqro8D6eOgwWCrxy7FM0GRQUzTrD1K
      PORT: "8000"
      ENCRYPTION_KEY: fw62ngbkPcqHTMk07N6c7kJZGCfMYlWHWW9PDgqudVY=
      JWT_SECRET_KEY: JyqjqFKgMQKZfyGA54T9petIFMrGkErP
      AUTH_SERVICE_URL: http://evo_auth:3001
      EVO_AI_CRM_URL: http://evo_crm:3000
      EVO_AUTH_BASE_URL: http://evo_auth:3001
      CORE_SERVICE_URL: http://evo_core:5555/api/v1
    volumes:
      - evo_processor_logs:/app/logs
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # --- BOT RUNTIME ---
  evo_bot_runtime:
    image: evoapicloud/evo-bot-runtime:1.0.0
    container_name: evo_bot_runtime
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      REDIS_URL: redis://:Wupqro8D6eOgwWCrxy7FM0GRQUzTrD1K@redis:6379/0
      AI_PROCESSOR_URL: http://evo_processor:8000
      BOT_RUNTIME_SECRET: jT0ujzuCZAILApLUsbrQ12vOC49nCaB9
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # --- FRONTEND (VITE / NGINX) ---
  evo_frontend:
    image: evoapicloud/evo-ai-frontend-community:1.0.0
    container_name: evo_frontend
    environment:
      VITE_APP_ENV: production
      VITE_API_URL: https://apicrm.prismadigital.app.br
      VITE_AUTH_API_URL: https://apicrm.prismadigital.app.br
      VITE_EVOAI_API_URL: https://apicrm.prismadigital.app.br
      VITE_AGENT_PROCESSOR_URL: https://apicrm.prismadigital.app.br
      VITE_WS_URL: wss://apicrm.prismadigital.app.br
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ==============================
  # EVOLUTION API - Banco de Dados
  # ==============================
  evolution-api-db:
    image: pgvector/pgvector:pg16
    container_name: evolution-api-db
    environment:
      POSTGRES_DB: evolution_api
      POSTGRES_USER: evolution_api
      POSTGRES_PASSWORD: 84a7a28ae39d133e9939b1abff2e3153
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    networks:
      - app_network
    volumes:
      - evolution_api_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution_api -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ==============================
  # EVOLUTION API - Redis
  # ==============================
  evolution-api-redis:
    image: redis:alpine
    container_name: evolution-api-redis
    command: redis-server --requirepass f324dba60f7ba1259dab2518a7bbb283 --appendonly yes
    networks:
      - app_network
    volumes:
      - evolution_api_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "f324dba60f7ba1259dab2518a7bbb283", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ==============================
  # EVOLUTION API - Serviço Principal
  # ==============================
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    environment:
      # Server
      SERVER_NAME: evolution-api
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: https://evolution-api.prismadigital.app.br

      # Database
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution_api:84a7a28ae39d133e9939b1abff2e3153@evolution-api-db:5432/evolution_api?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api

      # Redis (Cache)
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:f324dba60f7ba1259dab2518a7bbb283@evolution-api-redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"

      # Authentication
      AUTHENTICATION_API_KEY: 8723980456eecb208e3bae337657ab63993264615dc107c8c74348ecfe08be65
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: true

      # CORS
      CORS_ORIGIN: 
      CORS_METHODS: GET,POST,PUT,DELETE,PATCH
      CORS_CREDENTIALS: "true"

      # Logs
      LOG_LEVEL: ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS,WEBSOCKET
      LOG_COLOR: "true"
      LOG_BAILEYS: error

      # Configurações de dados
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      DATABASE_SAVE_IS_ON_WHATSAPP: "true"
      DATABASE_SAVE_IS_ON_WHATSAPP_DAYS: "7"
      DATABASE_DELETE_MESSAGE: "false"

      # Não deletar instância da memória
      DEL_INSTANCE: "false"

      # Desabilitar telemetria
      TELEMETRY_ENABLED: "false"
    networks:
      - app_network
    volumes:
      - evolution_api_data:/evolution/instances
    restart: unless-stopped

  # --- EVOFLOW (NestJS) — Porta 3334 — journeys/campaigns/segments (Parte 1) ---
  evo_flow:
    image: evoapicloud/evo-flow-community:1.0.0
    container_name: evo_flow
    # command em formato LIST (evita escape quebrado do `>-` YAML com aspas aninhadas)
    command:
      - sh
      - -c
      - |
        until node -e 'require("http").get("http://clickhouse:8123/ping",r=>process.exit(r.statusCode===200?0:1)).on("error",()=>process.exit(1))'; do
          echo 'Waiting for clickhouse...'; sleep 5;
        done
        node -e 'const{Client}=require("pg");const db=process.env.POSTGRES_DB_DATABASE;const c=new Client({host:process.env.POSTGRES_DB_HOST,port:+(process.env.POSTGRES_DB_PORT||5432),user:process.env.POSTGRES_DB_USERNAME,password:process.env.POSTGRES_DB_PASSWORD,database:"postgres"});c.connect().then(()=>c.query("CREATE DATABASE "+db)).then(()=>console.log("[init] created "+db)).catch(e=>console.log("[init] "+(e.code==="42P04"?"db already exists":e.message))).finally(()=>c.end());'
        node_modules/.bin/typeorm migration:run -d dist/database/ormconfig.js || echo '[init] migration:run failed (continuing)'
        exec node dist/main.js
    environment:
      NODE_ENV: production
      RUN_MODE: api
      QUEUE_MODE: direct
      STORAGE_MODE: clickhouse
      WRITE_MODE: ch-sync
      PORT: "3334"
      LOG_LEVEL: log
      AUTH_APIKEY_INTEGRATION_LOCAL: epzkTH3mV6QgnCvP6186rD15Rx3hTGqM
      EVO_AUTH_SERVICE_URL: http://evo_auth:3001
      EVO_AUTH_VALIDATE_TOKEN_ENDPOINT: /api/v1/auth/validate
      EVOAI_CRM_BASE_URL: http://evo_crm:3000
      EVOAI_CRM_API_TOKEN: wV6a2ftF4z8ZRcHkOpg7QhxyZumE0CJ1
      BROKER_TYPE: rabbitmq
      RABBITMQ_URL: amqp://evoflow:V4pafyFZo7JFK3H05fK1jqB13gA1Gj9Z@rabbitmq:5672
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: evo_campaign
      CLICKHOUSE_USERNAME: default
      CLICKHOUSE_PASSWORD: Cfx9LtM1xjzlGDEtB9e1IbqKTOCWcFTq
      CLICKHOUSE_TABLE: contact_events
      POSTGRES_DB_HOST: postgres
      POSTGRES_DB_PORT: "5432"
      POSTGRES_DB_USERNAME: postgres
      POSTGRES_DB_PASSWORD: BZ3fusNEdP4TJp1kmHeD3UD1KjnnfdEb
      POSTGRES_DB_DATABASE: evo_campaign
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: Wupqro8D6eOgwWCrxy7FM0GRQUzTrD1K
      REDIS_DB: "4"
    networks:
      - app_network
    restart: unless-stopped

  # --- CLICKHOUSE — DB analítico para eventos de contato (Parte 1) ---
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: Cfx9LtM1xjzlGDEtB9e1IbqKTOCWcFTq
      CLICKHOUSE_DB: default
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - app_network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "Cfx9LtM1xjzlGDEtB9e1IbqKTOCWcFTq", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # --- RABBITMQ — broker exigido pelo evo_flow no boot (Parte 1) ---
  rabbitmq:
    image: rabbitmq:3-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: evoflow
      RABBITMQ_DEFAULT_PASS: V4pafyFZo7JFK3H05fK1jqB13gA1Gj9Z
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

networks:
  app_network:
    external: true

volumes:
  postgres_data:
  redis_data:
  evo_auth_storage:
  evo_crm_storage:
  evo_processor_logs:
  evolution_api_db_data:
  evolution_api_redis_data:
  evolution_api_data:
  clickhouse_data:
  rabbitmq_data:
