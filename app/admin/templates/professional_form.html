{% extends "base.html" %}
{% block title %}{% if professional %}Editar{% else %}Novo{% endif %} Profissional - Agenda Atende{% endblock %}
{% block page_title %}{% if professional %}Editar Profissional{% else %}Novo Profissional{% endif %}{% endblock %}
{% block content %}
<div class="max-w-2xl">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6">
        <form method="post"
              action="{% if professional %}/admin/professionals/{{ professional.id }}/update{% else %}/admin/professionals{% endif %}"
              class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Nome *</label>
                <input type="text" name="name" value="{{ professional.name if professional else '' }}" required
                       class="w-full px-3.5 py-2 border border-slate-300/80 rounded-xl text-sm text-slate-900 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all shadow-xs">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Telefone</label>
                    <input type="text" name="phone" value="{{ professional.phone or '' if professional else '' }}"
                           class="w-full px-3.5 py-2 border border-slate-300/80 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all shadow-xs" placeholder="5585999999999">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">E-mail</label>
                    <input type="email" name="email" value="{{ professional.email or '' if professional else '' }}"
                           class="w-full px-3.5 py-2 border border-slate-300/80 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all shadow-xs">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Bio</label>
                <textarea name="bio" rows="3" class="w-full px-3.5 py-2 border border-slate-300/80 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all shadow-xs">{{ professional.bio or '' if professional else '' }}</textarea>
            </div>
            <div>
                <label class="flex items-center gap-2.5 text-xs font-medium text-slate-700 cursor-pointer select-none">
                    <input type="checkbox" name="active" value="1" {% if not professional or professional.active %}checked{% endif %}
                           class="h-4 w-4 text-blue-600 border-slate-300 rounded">
                    <span>Profissional ativo</span>
                </label>
            </div>
            <div class="flex gap-3 pt-2 border-t border-slate-100">
                <button type="submit" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium text-sm transition-all shadow-sm inline-flex items-center gap-2">
                    <i class="fas fa-save text-xs"></i> Salvar
                </button>
                <a href="/admin/professionals" class="px-4 py-2.5 bg-white hover:bg-slate-50 border border-slate-200/90 text-slate-700 hover:text-slate-900 rounded-xl font-medium text-sm transition-all shadow-xs">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
