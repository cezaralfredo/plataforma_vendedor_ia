<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Vendedor - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0b0f19;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.18) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.16) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(99, 102, 241, 0.08) 0px, transparent 60%);
            color: #f1f5f9;
            font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            padding: 1.5rem;
        }
        .login-card {
            width: 100%;
            max-width: 26rem;
            padding: 2.5rem 2rem;
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }
        .tag-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.85rem;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #34d399;
            margin-bottom: 1.25rem;
        }
        .brand-header {
            display: flex;
            align-items: center;
            gap: 0.875rem;
            margin-bottom: 1.5rem;
        }
        .brand-icon {
            width: 2.75rem;
            height: 2.75rem;
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            border-radius: 0.875rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.25rem;
        }
        .brand-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: -0.02em;
        }
        .brand-subtitle {
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .input-group {
            margin-bottom: 1.25rem;
        }
        .input-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
        }
        .input-control {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 0.75rem;
            color: #f8fafc;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        .input-control:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }
        .btn-submit {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }
        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
        }
        .alert-error {
            padding: 0.75rem 1rem;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 0.75rem;
            color: #f87171;
            font-size: 0.8rem;
            margin-bottom: 1.25rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="tag-pill">
            <i class="fas fa-store text-xs"></i> Portal do Vendedor • Filial
        </div>

        <div class="brand-header">
            <div class="brand-icon">
                <i class="fas fa-user-tie"></i>
            </div>
            <div>
                <h1 class="brand-title">Área de Vendas</h1>
                <p class="brand-subtitle">Gestão de Vendas & Comissões</p>
            </div>
        </div>

        {% if error %}
        <div class="alert-error">
            <i class="fas fa-exclamation-circle mr-1"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/seller/login">
            <div class="input-group">
                <label class="input-label" for="email">E-mail do Vendedor</label>
                <input class="input-control" type="email" id="email" name="email" required placeholder="seu.email@filial.com" autocomplete="username">
            </div>

            <div class="input-group">
                <label class="input-label" for="password">Senha de Acesso</label>
                <input class="input-control" type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-sign-in-alt"></i> Acessar Minha Área de Vendas
            </button>
        </form>
    </div>
</body>
</html>
