# Stack para Portainer Community Edition com Nginx Proxy Manager (NPM) já existente.
# Não publique portas públicas: no NPM, crie um Proxy Host para vendedor-ia:8000.
# Defina as variáveis abaixo na tela Environment variables da Stack.
services:
  waha:
    image: devlikeapro/waha:noweb-arm-2026.7.2
    restart: unless-stopped
    ports:
      - "${WAHA_PORT:-3000}:3000"
    environment:
      WAHA_ZIP_LOGS: "true"
      WAHA_LOG_FORMAT: "JSON"
      WAHA_PRINT_QR: "false"
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: "admin"
      WAHA_DASHBOARD_PASSWORD: "admin"
      WAHA_API_KEY: ${WAHA_API_KEY:-waha_anaue_secret_2026}
      WHATSAPP_HOOK_URL: http://api:8000/api/webhooks/whatsapp/waha
      WHATSAPP_HOOK_EVENTS: message
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      WHATSAPP_DEFAULT_ENGINE: NOWEB
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      agenda_internal:
        aliases:
          - waha

  mcp-gateway:
    image: "${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-cezaralfredo/plataforma_vendedor_ia}-mcp-gateway:${MCP_GATEWAY_IMAGE_TAG:?Defina MCP_GATEWAY_IMAGE_TAG no Portainer}"
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      API_KEY: ${API_KEY:?Defina API_KEY no Portainer}
      GATEWAY_KEY: ${MCP_GATEWAY_KEY:?Defina MCP_GATEWAY_KEY no Portainer}
    expose:
      - "8080"
    networks:
      agenda_internal:
      npm:
        aliases:
          - mcp-gateway
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/ready', timeout=2).raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agenda_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no Portainer}
      POSTGRES_DB: agenda_atende
    volumes:
      - agenda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda_user -d agenda_atende"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agenda_internal

  api:
    image: "${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-cezaralfredo/plataforma_vendedor_ia}:${IMAGE_TAG:?Defina IMAGE_TAG no Portainer}"
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://agenda_user:__POSTGRES_PASSWORD__@postgres:5432/agenda_atende}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no Portainer}
      API_KEY: ${API_KEY:?Defina API_KEY no Portainer}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Defina ADMIN_API_KEY no Portainer}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Defina ADMIN_USERNAME no Portainer}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD?Defina ADMIN_BOOTSTRAP_PASSWORD no Portainer (vazio apos criar a conta)}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Defina ADMIN_SESSION_SECRET no Portainer}
      ADMIN_RECOVERY_KEY: ${ADMIN_RECOVERY_KEY:?Defina ADMIN_RECOVERY_KEY no Portainer}
      APP_NAME: ${APP_NAME:-Anauê Design - Vendedor IA}
      DEBUG: "false"
      ASAAS_API_KEY: ${ASAAS_API_KEY:?Defina ASAAS_API_KEY no Portainer}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://api.asaas.com/v3}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:?Defina ASAAS_WEBHOOK_TOKEN no Portainer}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      NOTIFICATION_WEBHOOK_TOKEN: ${NOTIFICATION_WEBHOOK_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TRIAGE_ENABLED: ${TRIAGE_ENABLED:-true}
      TRIAGE_MODEL: ${TRIAGE_MODEL:-typesafe/jev-1.13}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      WAHA_BASE_URL: ${WAHA_BASE_URL:-http://waha:3000}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WAHA_API_KEY: ${WAHA_API_KEY:-waha_anaue_secret_2026}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-waha}
      SEED_DATA: "false"
    depends_on:
      postgres:
        condition: service_healthy
      waha:
        condition: service_started
    volumes:
      - product_uploads:/app/app/admin/static/uploads/products
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:8000/ready || python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)\" || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    expose:
      - "8000"
    networks:
      agenda_internal:
        aliases:
          - api
      npm:
        aliases:
          - vendedor-ia
          - vendedor-api
          - agenda-api
      mcp_internal:

volumes:
  agenda_pgdata:
    name: ${POSTGRES_VOLUME_NAME:-vendedor_ia_pgdata}
  product_uploads:
    name: ${PRODUCT_UPLOADS_VOLUME_NAME:-vendedor_ia_product_uploads}
  waha_sessions:
    name: ${WAHA_VOLUME_NAME:-vendedor_online_waha_sessions}
    external: true

networks:
  agenda_internal:
    driver: bridge
  npm:
    external: true
    name: ${NPM_NETWORK:-nginx-proxy_default}
  mcp_internal:
    external: true
    name: "${AGENDA_MCP_NETWORK:-agenda_mcp_internal}"
