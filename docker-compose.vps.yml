# =============================================================================
# Docker Compose para VPS Pura (sem Portainer)
# =============================================================================
# Uso: docker compose -f docker-compose.vps.yml --env-file .env.prod up -d
#
# Requer arquivo .env.prod na mesma pasta com todas as variáveis
# =============================================================================

services:
  # -----------------------------------------------------------------------------
  # Traefik - Reverse Proxy + SSL Automático (Let's Encrypt)
  # -----------------------------------------------------------------------------
  traefik:
    image: traefik:v3.0
    container_name: agenda_atende_traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - agenda_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"

  # -----------------------------------------------------------------------------
  # PostgreSQL - Banco de Dados
  # -----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: agenda_atende_pg
    environment:
      POSTGRES_USER: agenda_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agenda_atende
    env_file:
      - .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda_user -d agenda_atende"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agenda_network

  # -----------------------------------------------------------------------------
  # API - FastAPI Application
  # -----------------------------------------------------------------------------
  api:
    image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-agenda-atende}:latest
    container_name: agenda_atende_api
    environment:
      - DATABASE_URL=postgresql+psycopg://agenda_user:${POSTGRES_PASSWORD}@postgres:5432/agenda_atende
      - API_KEY=${API_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME:?Defina ADMIN_USERNAME em .env.prod}
      - ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD?Defina ADMIN_BOOTSTRAP_PASSWORD em .env.prod (vazio apos criar a conta)}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:?Defina ADMIN_SESSION_SECRET em .env.prod}
      - ADMIN_RECOVERY_KEY=${ADMIN_RECOVERY_KEY:?Defina ADMIN_RECOVERY_KEY em .env.prod}
      - APP_NAME=${APP_NAME}
      - DEBUG=${DEBUG:-false}
      - ASAAS_API_KEY=${ASAAS_API_KEY}
      - ASAAS_BASE_URL=${ASAAS_BASE_URL}
      - ASAAS_WEBHOOK_TOKEN=${ASAAS_WEBHOOK_TOKEN}
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - agenda_network
    labels:
      - "traefik.enable=true"
      # API Principal
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      # Admin Panel
      - "traefik.http.routers.admin.rule=Host(`api.${DOMAIN}`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.admin.loadbalancer.server.port=8000"
      # Webhooks Asaas (sem rate limit rigoroso)
      - "traefik.http.routers.webhooks.rule=Host(`api.${DOMAIN}`) && PathPrefix(`/webhooks`)"
      - "traefik.http.routers.webhooks.entrypoints=websecure"
      - "traefik.http.routers.webhooks.tls.certresolver=letsencrypt"
      - "traefik.http.services.webhooks.loadbalancer.server.port=8000"
      # MCP (timeout maior para agents)
      - "traefik.http.routers.mcp.rule=Host(`api.${DOMAIN}`) && PathPrefix(`/mcp`)"
      - "traefik.http.routers.mcp.entrypoints=websecure"
      - "traefik.http.routers.mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.mcp.loadbalancer.server.port=8000"
      # Rate limiting global
      - "traefik.http.middlewares.api-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.api-ratelimit.ratelimit.burst=50"
      - "traefik.http.routers.api.middlewares=api-ratelimit"
      - "traefik.http.routers.admin.middlewares=api-ratelimit"
      # Compressão
      - "traefik.http.middlewares.compress.compress=true"
      - "traefik.http.routers.api.middlewares=api-ratelimit,compress"
      - "traefik.http.routers.admin.middlewares=api-ratelimit,compress"

  # -----------------------------------------------------------------------------
  # Backup Automático - pg_dump + Rclone (S3/Wasabi/GDrive)
  # -----------------------------------------------------------------------------
  backup:
    image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY}-backup:latest
    container_name: agenda_atende_backup
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 3 * * *}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - RCLONE_CONFIG_FILE=/config/rclone/rclone.conf
      - RCLONE_DESTINATION=${RCLONE_DESTINATION:-}
    env_file:
      - .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
      - ./backups:/backups
      - ./rclone:/config/rclone:ro
    networks:
      - agenda_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # -----------------------------------------------------------------------------
  # Watchtower - Atualização Automática de Imagens (opcional)
  # -----------------------------------------------------------------------------
  watchtower:
    image: containrrr/watchtower:latest
    container_name: agenda_atende_watchtower
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - agenda_network
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

volumes:
  pgdata:
  traefik_letsencrypt:

networks:
  agenda_network:
    driver: bridge
