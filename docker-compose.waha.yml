version: "3.8"

services:
  waha:
    image: devlikeapro/waha:noweb-arm-2026.7.2
    container_name: agenda_waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - WAHA_ZIP_LOGS=true
      - WAHA_LOG_FORMAT=JSON
      - WAHA_PRINT_QR=true
      - WAHA_DASHBOARD_ENABLED=true
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=admin
      - WAHA_API_KEY=${WAHA_API_KEY:-waha_anaue_secret_2026}
      # Webhook de retorno para a API do Vendedor IA
      - WHATSAPP_HOOK_URL=http://vendedor-ia:8000/api/webhooks/whatsapp/waha
      - WHATSAPP_HOOK_EVENTS=message,message.any
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      npm_network:
        aliases:
          - waha
          - agenda_waha
          - agenda-waha

volumes:
  waha_sessions:
    driver: local

networks:
  npm_network:
    external: true
    name: ${NPM_NETWORK:-nginx-proxy_default}
