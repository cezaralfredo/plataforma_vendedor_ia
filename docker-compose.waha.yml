services:
  waha:
    image: devlikeapro/waha:${WAHA_IMAGE_TAG:-noweb-2026.7.2}
    container_name: agenda_waha
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - WAHA_ZIP_LOGS=true
      - WAHA_LOG_FORMAT=JSON
      - WAHA_PRINT_QR=false
      - WAHA_DASHBOARD_ENABLED=${WAHA_DASHBOARD_ENABLED:-false}
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:-}
      - WAHA_API_KEY=${WAHA_API_KEY:?Defina WAHA_API_KEY}
      # Webhook de retorno para a API do Vendedor IA
      - WHATSAPP_HOOK_URL=http://vendedor-ia:8000/api/webhooks/whatsapp/waha
      - WHATSAPP_HOOK_EVENTS=message.any
      - WHATSAPP_HOOK_HMAC_KEY=${WAHA_API_KEY:?Defina WAHA_API_KEY}
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      npm_network:
        aliases:
          - waha
          - agenda_waha
          - agenda-waha

volumes:
  waha_sessions:
    driver: local

networks:
  npm_network:
    external: true
    name: ${NPM_NETWORK:-nginx-proxy_default}
